<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accueil - Esdras Design</title>

  <style>
    body {
   /*   background: linear-gradient(135deg, #FFD700, #ffb347, #3a1c00);*/
   background: linear-gradient(135deg, #fff8e1, #ffd54f);
      color: #111;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      padding: 20px;
      text-align: center;
      color: #fff;
    }

    header img {
      height: 90px;
    }

    h1 {
      margin: 10px 0;
      font-size: 2.3em;
    }

    nav a {
      color: #fff;
      margin: 0 12px;
      text-decoration: none;
      font-weight: bold;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      background: #FFD700;
      left: 0;
      bottom: -5px;
      transition: 0.3s;
    }

    nav a:hover::after {
      width: 100%;
    }

    main {
      flex: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* GALERIE */
    .galerie {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    .galerie img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 14px;
      transition: 0.4s;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .galerie img:hover {
      transform: scale(1.08);
      filter: brightness(1.1);
    }

    /* BOUTON */
    .btn-container {
      margin-top: 50px;
    }

    .btn {
      padding: 16px 40px;
      background: #000;
      color: #FFD700;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.1em;
      transition: 0.3s;
    }

    .btn:hover {
      background: #222;
      transform: scale(1.1);
    }

    footer {
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 15px;
      text-align: center;
    }

    @media(max-width: 768px) {
      .galerie img {
        height: 170px;
      }

      h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>

<body>

<header>
  <img src="portfolio/20251207_192159.jpg" alt="Logo">

  <h1>Esdras Design</h1>
  <p>Des visuels modernes qui attirent et vendent 🚀</p>

  <nav>
    <a href="apropos.html">À propos</a>
    <a href="inscription.html">Inscription</a>
    <a href="contact.html">Contact</a>
    <a href="portfolio.html">Portfolio</a>
  </nav>
</header>

<main>

  <div class="galerie">
    <img src="home/img1.jpg">
    <img src="home/img2.jpg">
    <img src="home/img3.jpg">
    <img src="home/img4.jpg">
    <img src="home/img5.jpg">
    <img src="home/img6.jpg">
    <img src="home/img7.jpeg">
    <img src="home/img8.jpeg">
    <img src="home/img9.jpeg">
    <img src="home/img10.jpeg">
    <img src="home/img11.jpeg">
    <img src="home/img13.jpg">
  </div>

  <div class="btn-container">
    <a href="portfolio.html" class="btn">Voir mes créations</a>
  </div>

</main>

<footer>
  © 2026 Esdras Design — Tous droits réservés
</footer>

<script>
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });
</script>

</body>
</html>

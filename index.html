  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #fceabb, #f8b500);
      color: #3a1c00;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(58, 28, 0, 0.8);
      padding: 20px;
      text-align: center;
      color: #fff7e6;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    nav a {
      color: #fff7e6;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #ffeb99;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
    }
    .welcome-box {
      background: rgba(255, 235, 153, 0.85);
      padding: 40px 60px;

    }
    
    .welcome-box h1 {
      font-size: 3em;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .welcome-box p {
      font-size: 1.25em;
      margin-bottom: 30px;
      line-height: 1.5;
      color: #6b4500;
    }
    .btn {
      display: inline-block;
      padding: 15px 30px;
      background-color: #6b4500;
      color: #fff7e6;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 6px 12px rgba(107, 69, 0, 0.7);
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #a77200;
      box-shadow: 0 8px 18px rgba(167, 114, 0, 0.85);
    }
    footer {
      background: rgba(58, 28, 0, 0.8);
      padding: 15px;
      text-align: center;
      color: #fff7e6;
      font-size: 0.9em;
      box-shadow: 0 -4px 6px rgba(0,0,0,0.3);
    }
    @media(max-width: 600px) {
      .welcome-box {
        padding: 30px 20px;
      }
      .welcome-box h1 {
        font-size: 2em;
      }
    }
    .index-image {
      flex: 1 1 350px;
      text-align: center;
    }
    .index-image img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(90, 62, 27, 0.4);
    }
    .galerie {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .galerie img {
      width: 150px;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(90, 62, 27, 0.2);
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .galerie img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(90, 62, 27, 0.4);
    }
  </style>
</head>

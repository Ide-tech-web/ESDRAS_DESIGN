<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>À propos - Esdras Design</title>

  <style>
    body {
      background: linear-gradient(135deg, #fff8e1, #ffd54f);
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    header {
      background-color: #5a3e1b;
      color: #fff7e6;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: #fff7e6;
      margin: 0 12px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd54f;
    }

    main {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    /* SECTION TEXTE */
    .apropos {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
      margin-bottom: 40px;
    }

    .apropos-text {
      flex: 1;
    }

    .apropos-image {
      flex: 1;
    }

    .apropos-image img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* GRID MODERNE (IMAGES + VIDEOS) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: 0.4s;
      background: #fff;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img,
    .card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* TITRES */
    h2 {
      text-align: center;
      margin: 40px 0 20px;
      color: #5a3e1b;
    }

    /* AUDIO */
    .audio-box {
      text-align: center;
      margin-top: 40px;
    }

    footer {
      background-color: #5a3e1b;
      color: #fff7e6;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    @media(max-width: 768px) {
      .apropos {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Esdras Design</h1>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="inscription.html">Inscription</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>

  <!-- SECTION A PROPOS -->
  <div class="apropos">
    <div class="apropos-text">
      <h2>Notre passion du design</h2>
      <p>Esdras Design est née de l’envie de créer des visuels authentiques et percutants.</p>
      <p>Nous combinons créativité et stratégie pour donner vie à vos idées.</p>
    </div>

    <div class="apropos-image">
      <img src="PRESENTATIONS/img1.jpg" alt="">
    </div>
  </div>

  <!-- GALERIE + VIDEOS MIX -->
  <h2>Nos créations 🎨</h2>

  <div class="grid">

    <!-- IMAGES -->
    <div class="card"><img src="PRESENTATIONS/img1.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img2.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img3.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img4.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img5.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img6.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img10.jpeg"></div>
    <div class="card"><img src="PRESENTATIONS/img11.jpeg"></div>
    <div class="card"><img src="PRESENTATIONS/img12.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img13.jpeg"></div>
    <div class="card"><img src="PRESENTATIONS/img14.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img15.jpg"></div>
    <div class="card"><img src="PRESENTATIONS/img16.jpg"></div>
    

    <!-- VIDEOS -->
    <div class="card">
      <video controls>
        <source src="videos/video1.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls>
        <source src="videos/video2.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls>
        <source src="videos/video3.mp4" type="video/mp4">
      </video>
    </div>

  </div>


</main>

<footer>
  © 2026 Esdras Design — Tous droits réservés
</footer>

<script>
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });
</script>

</body>
</html>
